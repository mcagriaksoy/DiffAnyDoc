name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish sdist & wheel to PyPI (requires PyPI Trusted Publishing)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    name: Windows Release (Portable + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[web,desktop]" pyinstaller
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
      - name: Build portable .exe and installer .exe
        run: python tools/build.py --targets portable installer
      - name: Windows Defender scan
        shell: pwsh
        run: |
          $defender = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (Test-Path $defender) {
            Get-ChildItem dist\DiffAnyDoc-*-windows-*.exe | ForEach-Object {
              Write-Host "Scanning $($_.Name) with Windows Defender..."
              & $defender -Scan -ScanType 3 -File $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } else {
            Write-Host "Windows Defender CLI not found; skipping scan."
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\DiffAnyDoc-*-windows-*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import diffanydoc; print(diffanydoc.__version__)"
          echo "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DiffAnyDoc-*-windows-*.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiffAnyDoc-windows
          path: |
            dist/DiffAnyDoc-*-windows-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DiffAnyDoc ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/DiffAnyDoc-*-windows-*.exe
            dist/SHA256SUMS.txt

  pypi:
    name: PyPI Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiffAnyDoc-pypi-dist
          path: dist/*
          if-no-files-found: error
      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
