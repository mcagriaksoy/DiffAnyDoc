name: Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish sdist & wheel to PyPI (requires PyPI Trusted Publishing)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-release:
    name: Windows Release (Portable + Installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); import diffanydoc; print(diffanydoc.__version__)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -match "^v(\d+\.\d+\.\d+.*)$") {
            $tagVer = $Matches[1]
            if ($tagVer -ne $v) {
              Write-Host "Syncing package version ($v -> $tagVer) to match git tag $env:GITHUB_REF_NAME"
              (Get-Content src/diffanydoc/__init__.py -Raw) -replace '__version__\s*=\s*"[^"]+"', "__version__ = `"$tagVer`"" | Set-Content src/diffanydoc/__init__.py -NoNewline
              (Get-Content pyproject.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$tagVer`"" | Set-Content pyproject.toml -NoNewline
              $v = $tagVer
            }
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building DiffAnyDoc release version $v (tag v$v)"
      - name: Install dependencies
        run: python -m pip install -e ".[web,desktop]" pyinstaller
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y
          }
      - name: Build portable .exe and installer .exe
        run: python tools/build.py --targets portable installer
      - name: Windows Defender scan
        shell: pwsh
        run: |
          $defender = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (Test-Path $defender) {
            Get-ChildItem dist\DiffAnyDoc-*-windows-*.exe | ForEach-Object {
              Write-Host "Scanning $($_.Name) with Windows Defender..."
              $out = & $defender -Scan -ScanType 3 -File $_.FullName 2>&1 | Out-String
              Write-Host $out
              if ($out -match " found " -and $out -notmatch "found no threats") {
                Write-Error "Windows Defender detected a threat in $($_.Name)"
                exit 1
              }
            }
          } else {
            Write-Host "Windows Defender CLI not found; skipping scan."
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\DiffAnyDoc-*-windows-*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/DiffAnyDoc-*-windows-*.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiffAnyDoc-windows-${{ steps.version.outputs.tag }}
          path: |
            dist/DiffAnyDoc-*-windows-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DiffAnyDoc ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/DiffAnyDoc-*-windows-*.exe
            dist/SHA256SUMS.txt

  pypi:
    name: PyPI Package (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Upload PyPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiffAnyDoc-pypi-dist
          path: dist/*
          if-no-files-found: error
      - name: Publish to PyPI
        if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
